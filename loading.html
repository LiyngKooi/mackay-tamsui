<!-- Loading Page 的 HTML 結構。已經寫進 index.html 的 <body> 最前端。 -->
<div id="loading-screen" role="status" aria-live="polite" aria-label="載入中">
  <div class="ld-wrap">
    <figure class="ld-fig">
      <img id="loading-hero" alt="" draggable="false">
    </figure>
    <div class="ld-text">
      <div class="ld-head">
        <h1 class="ld-zh">寧願燒盡，不願鏽壞</h1>
        <p class="ld-en">Rather burn out than rust out</p>
      </div>
      <div class="ld-meter">
        <div class="ld-track"><span id="ld-bar"></span></div>
        <p class="ld-count">滬尾淡水 載入中<span class="ld-dots">...</span> <span id="ld-pct">0</span>%</p>
      </div>
    </div>
  </div>
</div>
