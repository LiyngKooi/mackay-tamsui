<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR 測試</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    background: #F7F1E2;
    color: #3A2E1C;
    font-family: 'Huninn', 'Noto Sans TC', -apple-system, system-ui, sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: .02em; }
  p.sub { margin: 0 0 22px; font-size: 13.5px; opacity: .72; }
  h2 { font-size: 15px; margin: 26px 0 8px; }
  .box {
    background: #FFFDF6;
    border: 1px solid rgba(107, 83, 52, .28);
    padding: 14px 15px;
    margin-bottom: 16px;
  }
  dl { margin: 0; font-size: 13px; }
  dt { font-weight: 700; margin-top: 8px; }
  dt:first-child { margin-top: 0; }
  dd {
    margin: 2px 0 0; word-break: break-all;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12.5px; color: #6B5334;
  }
  .yes { color: #2F6B3A; font-weight: 700; }
  .no  { color: #9C3B22; font-weight: 700; }
  a.try, button.try {
    display: block; width: 100%;
    margin: 0 0 12px;
    padding: 15px 16px;
    border: 1.5px solid #C99B45;
    background: #FFFDF6;
    color: #6B5116;
    font: inherit; font-size: 15.5px;
    text-align: center; text-decoration: none;
    cursor: pointer;
  }
  a.try b, button.try b { display: block; font-size: 12.5px; opacity: .7; font-weight: 400; margin-top: 3px; }
  #log {
    white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; color: #6B5334; min-height: 2em;
  }
  model-viewer { width: 100%; height: 56vw; max-height: 380px; background: #FFFDF6; }
</style>
</head>
<body>

<h1>AR 測試頁</h1>
<p class="sub">四種啟動方式各試一次，哪一個打開相機就記下哪一個。</p>

<h2>這台裝置</h2>
<div class="box">
  <dl id="facts"></dl>
</div>

<h2>四種啟動方式</h2>

<a class="try" id="t1" href="#">方式一　intent 連結
  <b>Scene Viewer，intent:// 協定</b></a>

<a class="try" id="t2" href="#">方式二　https 連結
  <b>Scene Viewer，一般網址</b></a>

<button class="try" id="t3" type="button">方式三　model-viewer 的 activateAR()
  <b>按鈕呼叫，等同網站目前的做法</b></button>

<p style="font-size:13.5px;margin:18px 0 8px">方式四　下面這塊模型右下角那顆立方體：</p>
<model-viewer id="mv"
  src="https://liyngkooi.github.io/s2/bottle.glb"
  ar ar-modes="scene-viewer webxr quick-look"
  camera-controls auto-rotate
  ios-src="https://liyngkooi.github.io/s2/bottle.usdz"
  alt="奎寧藥瓶"></model-viewer>

<h2>紀錄</h2>
<div class="box"><div id="log">（尚未操作）</div></div>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<script>
(function () {
  var MODEL = 'https://liyngkooi.github.io/s2/bottle.glb';
  var PAGE  = location.href;
  var log = document.getElementById('log');
  var lines = [];
  function say(s) {
    lines.push(new Date().toLocaleTimeString() + '  ' + s);
    log.textContent = lines.join('\n');
  }

  /* ---- the Scene Viewer address, written out by hand ---- */
  var q = 'file=' + encodeURIComponent(MODEL) +
          '&mode=ar_preferred' +
          '&title=' + encodeURIComponent('奎寧藥瓶');

  var intentUrl = 'intent://arvr.google.com/scene-viewer/1.0?' + q +
                  '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;' +
                  'action=android.intent.action.VIEW;' +
                  'S.browser_fallback_url=' + encodeURIComponent(PAGE) + ';end;';

  var httpsUrl = 'https://arvr.google.com/scene-viewer/1.0?' + q;

  document.getElementById('t1').href = intentUrl;
  document.getElementById('t2').href = httpsUrl;
  document.getElementById('t1').addEventListener('click', function () { say('方式一　已送出 intent 連結'); });
  document.getElementById('t2').addEventListener('click', function () { say('方式二　已送出 https 連結'); });

  /* ---- what this browser says about itself ---- */
  var ua = navigator.userAgent;
  var facts = document.getElementById('facts');
  function row(k, v, good) {
    var dt = document.createElement('dt'); dt.textContent = k;
    var dd = document.createElement('dd');
    dd.textContent = v;
    if (good === true)  dd.className = 'yes';
    if (good === false) dd.className = 'no';
    facts.appendChild(dt); facts.appendChild(dd);
  }

  var which = /SamsungBrowser/i.test(ua) ? 'Samsung Internet'
            : /EdgA/i.test(ua)           ? 'Edge'
            : /OPR|Opera/i.test(ua)      ? 'Opera'
            : /Firefox/i.test(ua)        ? 'Firefox'
            : /Chrome/i.test(ua)         ? 'Chrome'
            : /CriOS/i.test(ua)          ? 'Chrome (iOS)'
            : '不明';
  row('瀏覽器', which);
  row('系統', /Android/i.test(ua) ? 'Android' : (/iPhone|iPad/i.test(ua) ? 'iOS' : '其他'));
  row('完整 User-Agent', ua);
  row('WebXR 介面', ('xr' in navigator) ? '有' : '沒有', ('xr' in navigator));

  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-ar').then(function (ok) {
      row('WebXR immersive-ar', ok ? '支援' : '不支援', ok);
    }, function (e) { row('WebXR immersive-ar', '查詢失敗 ' + e, false); });
  }

  /* ---- can the model itself be fetched from here ---- */
  fetch(MODEL, { method: 'GET' }).then(function (r) {
    row('模型檔', r.status + ' ' + (r.headers.get('content-type') || '(無類型)'),
        r.status === 200);
    if (r.status !== 200) throw new Error('伺服器回 ' + r.status);
    return r.arrayBuffer();
  }).then(function (buf) {
    row('模型大小', (buf.byteLength / 1048576).toFixed(2) + ' MB', buf.byteLength < 10485760);
    var dv = new DataView(buf);
    var magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
    var jlen = dv.getUint32(12, true);
    var json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jlen)));
    row('檔頭', magic + ' 版本 ' + dv.getUint32(4, true), magic === 'glTF');
    row('必需的 glTF 擴充', JSON.stringify(json.extensionsRequired || null),
        !json.extensionsRequired || !json.extensionsRequired.length);
  }).catch(function (e) { row('模型檢查', '無法完成：' + e.message, false); });

  /* ---- model-viewer's own opinion ---- */
  var mv = document.getElementById('mv');
  customElements.whenDefined('model-viewer').then(function () {
    setTimeout(function () {
      row('model-viewer 已載入模型', mv.loaded ? '是' : '否', !!mv.loaded);
      row('model-viewer 說可以開 AR', mv.canActivateAR ? '可以' : '不可以', !!mv.canActivateAR);
    }, 2500);
  }, function () { row('model-viewer', '元件載入失敗', false); });

  document.getElementById('t3').addEventListener('click', function () {
    say('方式三　呼叫 activateAR()');
    try {
      var p = mv.activateAR();
      if (p && p.then) p.then(function () { say('方式三　沒有回報錯誤'); },
                              function (e) { say('方式三　被拒絕：' + e); });
    } catch (e) { say('方式三　丟出例外：' + e); }
  });

  window.addEventListener('error', function (e) { say('頁面錯誤：' + e.message); });
})();
</script>
</body>
</html>
